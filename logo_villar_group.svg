<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#d40000"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CFC00"/>
      <stop offset="100%" stop-color="#1e8c00"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="900" height="460" fill="#ffffff"/>

  <!-- IMPORTADORA -->
  <text x="450" y="95" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-size="56" font-weight="900" letter-spacing="10"
        fill="#1a1a1a" stroke="#000" stroke-width="1.5">IMPORTADORA</text>
  <rect x="290" y="112" width="320" height="6" rx="3" fill="#d40000"/>

  <!-- VILLAR script -->
  <g filter="url(#shadow)">
    <text x="430" y="300" text-anchor="middle"
          font-family="Brush Script MT, 'Segoe Script', 'Comic Sans MS', cursive"
          font-size="170" font-weight="bold" font-style="italic"
          fill="url(#redGrad)" stroke="#4d0000" stroke-width="6"
          paint-order="stroke" transform="rotate(-4 430 300)">Villar</text>
    <!-- subrayado llamativo -->
    <path d="M 160 330 Q 430 385 700 320 Q 500 365 160 330 Z"
          fill="#d40000" stroke="#4d0000" stroke-width="4"/>
  </g>

  <!-- Grupo -->
  <text x="450" y="415" text-anchor="middle"
        font-family="Brush Script MT, 'Segoe Script', cursive"
        font-size="66" font-weight="bold" font-style="italic"
        fill="url(#redGrad)" stroke="#4d0000" stroke-width="3"
        paint-order="stroke">Group</text>

  <!-- Rana de juguete -->
  <g transform="translate(690,170) scale(1.15)" filter="url(#shadow)">
    <!-- piernas traseras -->
    <ellipse cx="-34" cy="62" rx="22" ry="13" fill="url(#greenGrad)" stroke="#0d4d00" stroke-width="3"/>
    <ellipse cx="34" cy="62" rx="22" ry="13" fill="url(#greenGrad)" stroke="#0d4d00" stroke-width="3"/>
    <!-- cuerpo -->
    <ellipse cx="0" cy="30" rx="46" ry="42" fill="url(#greenGrad)" stroke="#0d4d00" stroke-width="3.5"/>
    <!-- panza -->
    <ellipse cx="0" cy="44" rx="30" ry="24" fill="#d9ffb3" stroke="#0d4d00" stroke-width="2"/>
    <!-- ojos -->
    <circle cx="-20" cy="-16" r="15" fill="#ffffff" stroke="#0d4d00" stroke-width="3"/>
    <circle cx="20" cy="-16" r="15" fill="#ffffff" stroke="#0d4d00" stroke-width="3"/>
    <circle cx="-20" cy="-16" r="7" fill="#111"/>
    <circle cx="20" cy="-16" r="7" fill="#111"/>
    <circle cx="-23" cy="-19" r="2.5" fill="#fff"/>
    <circle cx="17" cy="-19" r="2.5" fill="#fff"/>
    <!-- sonrisa -->
    <path d="M -16 18 Q 0 32 16 18" fill="none" stroke="#0d4d00" stroke-width="3.5" stroke-linecap="round"/>
    <!-- mejillas -->
    <circle cx="-30" cy="12" r="5" fill="#ff9999" opacity="0.7"/>
    <circle cx="30" cy="12" r="5" fill="#ff9999" opacity="0.7"/>
  </g>
</svg>